[package]
name = "agents-with-profiles"
description = "Agents with Profiles (AwP) — a behavior-profile layer on top of a4aa: a base agent spec plus a named, versioned profile materializes a virtual agent with uniform session and turn semantics. Ships the `awp` CLI for document inspection, profile resolution, and profiled runs usable by hosts in any language."
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/Agents-with-Profiles"
readme = "README.md"
keywords = ["agent", "acp", "profiles", "json-rpc", "cli"]
categories = ["asynchronous", "network-programming", "os"]

[lib]
name = "awp"
path = "src/lib.rs"

[[bin]]
name = "awp"
path = "src/bin/awp.rs"

[features]
# `dialects` powers `awp materialize --dialect <name>` through the
# a4aa-dialects registry. It is on by default so the CLI works out of the
# box; hosts embedding awp as a library can disable default features and
# depend on exactly one `a4aa-<agent>` crate instead.
# `presets` is the canonical headless-agent launch library consumed by `va
# profile add --preset`. It needs the card registry to copy spawn argv.
default = ["dialects", "presets"]
dialects = ["dep:a4aa-dialects"]
presets = ["dialects"]

[dependencies]
a4aa = { path = "../Adapter-For-All-Agents", version = "0.4.0" }
a4aa-dialects = { path = "../Adapter-For-All-Agents/crates/a4aa-dialects", version = "0.4.0", optional = true }
async-trait = "0.1"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Direct single-agent adapter dependency: the tests drive a resolved
# profile's mechanisms through one adapter crate, no registry involved.
a4aa-codex = { path = "../Adapter-For-All-Agents/crates/a4aa-codex", version = "0.4.0" }
a4aa-devin = { path = "../Adapter-For-All-Agents/crates/a4aa-devin", version = "0.4.0" }
