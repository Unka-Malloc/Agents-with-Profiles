[package]
name = "agents-with-profiles"
description = "Agents with Profiles (AwP) — a behavior-profile layer on top of a4aa: a base agent spec plus a named, versioned profile materializes a virtual agent with uniform session and turn semantics. Ships the `awp` CLI for document inspection, profile resolution, and profiled runs usable by hosts in any language."
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/Agents-with-Profiles"
readme = "README.md"
keywords = ["agent", "acp", "profiles", "json-rpc", "cli"]
categories = ["asynchronous", "network-programming", "os"]

[lib]
name = "awp"
path = "src/lib.rs"

[[bin]]
name = "awp"
path = "src/bin/awp.rs"

[features]
# Every adapter is its own feature so a single-agent host compiles exactly
# the descriptor it drives. `dialects` enables all of them for multi-agent
# hosts and keeps `awp materialize --dialect <name>` working out of the box;
# it is on by default. `presets` needs the cards of the six headless agents
# it launches, so it enables those adapters rather than every dialect.
default = ["dialects", "presets"]
dialects = [
    "antigravity",
    "claude",
    "codex",
    "commandcode",
    "copilot",
    "cursor",
    "devin",
    "dsh",
    "factory",
    "grok",
    "hermes",
    "kilocode",
    "kimicode",
    "kiro",
    "openclaw",
    "opencode",
    "pi",
]
antigravity = ["dep:a4aa-antigravity"]
claude = ["dep:a4aa-claude"]
codex = ["dep:a4aa-codex"]
commandcode = ["dep:a4aa-command-code"]
copilot = ["dep:a4aa-copilot"]
cursor = ["dep:a4aa-cursor"]
devin = ["dep:a4aa-devin"]
dsh = ["dep:a4aa-dsh"]
factory = ["dep:a4aa-factory"]
grok = ["dep:a4aa-grok"]
hermes = ["dep:a4aa-hermes"]
kilocode = ["dep:a4aa-kilo-code"]
kimicode = ["dep:a4aa-kimi-code"]
kiro = ["dep:a4aa-kiro"]
openclaw = ["dep:a4aa-open-claw"]
opencode = ["dep:a4aa-opencode"]
pi = ["dep:a4aa-pi"]
presets = ["codex", "cursor", "dsh", "hermes", "opencode", "pi"]

[dependencies]
a4aa = "0.5.1"
a4aa-antigravity = { version = "0.5", optional = true }
a4aa-claude = { version = "0.5", optional = true }
a4aa-codex = { version = "0.5", optional = true }
a4aa-command-code = { version = "0.5", optional = true }
a4aa-copilot = { version = "0.5", optional = true }
a4aa-cursor = { version = "0.5", optional = true }
a4aa-devin = { version = "0.5", optional = true }
a4aa-dsh = { version = "0.5", optional = true }
a4aa-factory = { version = "0.5", optional = true }
a4aa-grok = { version = "0.5", optional = true }
a4aa-hermes = { version = "0.5", optional = true }
a4aa-kilo-code = { version = "0.5", optional = true }
a4aa-kimi-code = { version = "0.5", optional = true }
a4aa-kiro = { version = "0.5", optional = true }
a4aa-open-claw = { version = "0.5", optional = true }
a4aa-opencode = { version = "0.5", optional = true }
a4aa-pi = { version = "0.5", optional = true }
async-trait = "0.1"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Adapter-specific tests live behind the matching feature, so a trimmed test
# build never compiles an adapter the selected feature set did not ask for.
