# crates.io publication for agents-with-profiles, gated on the same
# verification gate as local development (`scripts/verify.sh`).
#
# Trigger: push a version tag (`git tag v0.1.0 && git push origin v0.1.0`)
# after the matching Cargo.toml version. The crate depends on published
# a4aa crates, so this workflow only succeeds after Adapter-For-All-Agents
# has published its matching versions — the retry loop rides out crates.io
# index propagation.
#
# Required secret: CARGO_REGISTRY_TOKEN (crates.io API token scoped to
# agents-with-profiles).
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # `a4aa` deps are path+version: verify compiles against the sibling
      # checkout, publish strips the paths for the crates.io versions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Agents-With-Profiles
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Unka-Malloc/Adapter-For-All-Agents
          path: Adapter-For-All-Agents
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: scripts/verify.sh
        working-directory: Agents-With-Profiles

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Publish agents-with-profiles
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run on an already-released version must pass
          # instead of failing on "already uploaded".
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='agents-with-profiles'][0])")
          if cargo info "agents-with-profiles@$version" 2>/dev/null | grep -q "^version: $version"; then
            echo "agents-with-profiles $version already published — nothing to do"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if cargo publish --token "$CARGO_REGISTRY_TOKEN"; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::could not publish agents-with-profiles"
          exit 1
