# crates.io publication for agents-with-profiles, gated on the same
# verification gate as local development (`scripts/verify.sh`).
#
# Trigger: push a version tag (`git tag v0.1.0 && git push origin v0.1.0`)
# after the matching Cargo.toml version. The crate depends on published
# a4aa crates, so this workflow only succeeds after Adapter-For-All-Agents
# has published its matching versions — the retry loop rides out crates.io
# index propagation.
#
# Credentials: crates.io Trusted Publishing — the crate allowlists this
# repo+workflow; the auth action exchanges the job's OIDC token for a
# scoped short-lived crates.io token. No stored secret.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # `a4aa` deps are path+version: verify compiles against the sibling
      # checkout, publish strips the paths for the crates.io versions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Agents-With-Profiles
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Unka-Malloc/Adapters-for-All-Agents
          ref: v0.2.0
          path: Adapter-For-All-Agents
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: scripts/verify.sh
        working-directory: Agents-With-Profiles

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # The crate's path+version deps resolve eagerly, so the sibling
      # checkout must exist for cargo metadata/publish as well.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Agents-With-Profiles
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Unka-Malloc/Adapters-for-All-Agents
          ref: v0.2.0
          path: Adapter-For-All-Agents
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish agents-with-profiles
        working-directory: Agents-With-Profiles
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Idempotent: "already uploaded" is success, not failure. A
          # separate cargo-info probe depends on flaky index access, so the
          # publish output itself is the source of truth.
          for attempt in 1 2 3 4 5; do
            if cargo publish --token "$CARGO_REGISTRY_TOKEN" 2>&1 | tee /tmp/awp-publish.log; then
              exit 0
            fi
            if grep -qi 'already uploaded\|already exists' /tmp/awp-publish.log; then
              echo "agents-with-profiles already published — nothing to do"
              exit 0
            fi
            sleep 30
          done
          echo "::error::could not publish agents-with-profiles"
          exit 1
